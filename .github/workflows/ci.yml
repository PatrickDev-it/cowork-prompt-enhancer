name: ci

# Validates the TypeScript and Python logic only. The GPU inference path (llama-server.exe +
# vendored CUDA DLLs, server/bin/ and server/models/*.gguf) is Windows-only, ~7.9 GB, and out of
# CI's reach by design — see RFC-0025. Nothing here starts or depends on llama-server.

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: server/modules/requirements-dev.lock

      - name: Frozen install
        run: bun run install:frozen
      - name: Format, lint, typecheck, and test
        run: bun run check
      - name: Offline reviewer path
        env:
          COWORK_PROFILE: mock
        run: |
          bun run preflight
          bun run demo:mock
          bun run benchmark
      - name: Dependency audit
        run: bun run audit
