name: release-validation

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: server/modules/requirements-dev.lock
      - name: Frozen install
        run: bun run install:frozen
      - name: Application and supply-chain gates
        run: |
          bun run check
          bun run audit
          bun run docs:check
          bun run security:scan
          bun run demo:record
      - name: Build tag-matched release bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun run scripts/release.ts --version "$VERSION" --output ".artifacts/release/$GITHUB_REF_NAME"
          bun run scripts/release.ts --version "$VERSION" --output ".artifacts/release/$GITHUB_REF_NAME" --validate-only
      - name: Upload validated release bundle
        uses: actions/upload-artifact@v7
        with:
          name: cowork-prompt-enhancer-${{ github.ref_name }}
          path: .artifacts/release/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 30
