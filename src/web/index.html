<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Prompt Optimizer — intent-to-specification compiler</title>
    <meta
      name="description"
      content="Compile a rough request into a structured, implementation-ready specification. Runs on your device by default — no server, no account."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="mark"><strong>ai-prompt-optimizer</strong> <span>intent → specification</span></div>
      <div class="masthead-spacer"></div>
      <button id="open-settings" class="ghost-button" type="button" aria-haspopup="dialog">engine ·&nbsp;<span id="engine-label">on device</span></button>
    </header>

    <main class="workbench">
      <section class="pane source-pane" aria-labelledby="source-heading">
        <div class="pane-head"><span id="source-heading">Source</span></div>
        <div class="pane-body">
          <label class="visually-hidden" for="request">Your rough request</label>
          <textarea
            id="request"
            spellcheck="false"
            placeholder="add login and make it secure, use the db we already have"
          ></textarea>
          <div class="source-actions">
            <button id="compile" class="compile-button" type="button">Compile <kbd>⌘↵</kbd></button>
            <span class="hint">Write it rough. The compiler does the formalizing.</span>
          </div>
        </div>
      </section>

      <section class="pane spec-pane" aria-labelledby="spec-heading">
        <div class="pane-head">
          <span id="spec-heading">Compiled</span>
          <div class="pane-head-spacer"></div>
          <button id="copy-all" class="ghost-button" type="button" hidden>copy markdown</button>
          <button id="download" class="ghost-button" type="button" hidden>.md</button>
        </div>
        <div class="pane-body">
          <div id="notice" class="notice" role="alert" hidden>
            <h2 id="notice-title">Error</h2>
            <p id="notice-body"></p>
          </div>
          <div id="spec" aria-live="polite"></div>
          <div id="placeholder" class="placeholder">
            <strong>No specification yet.</strong>
            <span>Describe a task on the left and compile it.</span>
          </div>
        </div>
      </section>
    </main>

    <div class="rail" id="rail" data-state="idle">
      <span class="rail-dot"></span>
      <span class="rail-item" id="rail-status">Starting…</span>
      <div class="rail-spacer"></div>
      <span class="rail-item" id="rail-engine"></span>
      <div class="rail-progress" id="rail-progress" style="width: 0"></div>
    </div>

    <div class="scrim" id="scrim" data-open="false"></div>
    <aside class="panel" id="panel" data-open="false" role="dialog" aria-modal="true" aria-label="Engine settings">
      <div class="panel-head">
        <span>Engine</span>
        <div class="masthead-spacer"></div>
        <button id="close-settings" class="icon-button" type="button" aria-label="Close settings">esc</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
